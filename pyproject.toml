[project]
name = "apartment-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Robert Nyström", email = "golgafrincham@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.4",
    "result>=0.17.0",
]

[project.scripts]
apartment-scraper = "apartment_scraper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://_json_key_base64:@europe-west1-python.pkg.dev/toolsense/toolsense-py-utils/simple/"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]
